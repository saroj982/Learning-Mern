<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table</title>
  <style>
    table,
    td,
    th {
      border: 1px solid black;
      border-collapse: separate;
      padding: 5px;
    }

    td:nth-child(2n) {
      background-color: #4889d3;
    }

    td:nth-child(2n-1) {
      background-color: #c047dc;
    }

    th {
      background-color: #62c827;
    }
  </style>
  <link rel="stylesheet" href="form.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>

  <h1 class="head">Profile form</h1>
  <form action="/profile" method="get">
    <label for="name"><i class="fa-solid fa-user"></i>Name</label>
    <input type="text" id="name" placeholder="Enter your name" minlength="3" maxlength="50" />

    <label for="age"><i class="fa-solid fa-cake"></i>Age</label>
    <input type="number" id="age" min="1" max="100" placeholder="Enter age">

    <label for="email"><i class="fa-solid fa-envelope"></i>Email</label>
    <input type="email" id="email" placeholder="Enter your email" />

    <label for="phone"><i class="fa-solid fa-phone"></i>Phone</label>
    <input type="tel" id="phone" value="+977" />

    <label for="password"><i class="fa-solid fa-lock"></i>Password</label>
    <div class="password">
      <input type="password" id="password" name="password" />
      <i class="fa-solid fa-eye"></i>
    </div>

    <!-- checkbox for multiselect-->
    <div class="hobbies">
      <label for="hobbies"><i class="fa-solid fa-running"></i>Hobbies</label>
      <input type="checkbox" />Music <input type="checkbox" />Gaming
      <input type="checkbox" />Dancing <input type="checkbox" />Movies
      <input type="checkbox" checked />Swimming
    </div>

    <!-- radio single select-->
    <label for="gender"><i class="fa-solid fa-mars-and-venus"></i>Gender</label>
    <div class="gender">
      <input type="radio" name="gender" />Male
      <input type="radio" name="gender" />Femlale
      <input type="radio" name="gender" />Other
    </div>

    <label for="docs"><i class="fa-solid fa-file"></i>File</label>
    <input type="file" name="file" id="docs" accept=".jpeg,.png,.pdf" multiple />

    <label for="meeting"><i class="fa-solid fa-calendar"></i>Meeting date</label>
    <input type="date" id="meeting" />
    <input type="time" id="meeting" />

    <!-- <label for="ratings"><i class="fa-solid fa-star"></i>Ratings</label>
    <input type="range" name="rating" id="ratings" min="1" max="10" step="0.5" />

    <label for="color">Color</label>
    <input type="color" id="color" /> -->

    <label for="search"><i class="fa-solid fa-magnifying-glass"></i>Search</label>
    <input type="search" id="search" list="animals" />
    <datalist id="animals">
      <option value="Cat">Cat</option>
      <option value="Dog">Dog</option>
      <option value="Elephant">Elephant</option>
      <option value="Tiger">Tiger</option>
      <option value="Leopard">Leopard</option>
      <option value="Rabbit">Rabbit</option>
    </datalist>

    <!-- dropdown -->
    <label for="class"><i class="fa-solid fa-book-open"></i>class</label>
    <select name="class" id="class">
      <option value="" disabled selected>Select your class</option>
      <option value="class1">Class1</option>
      <option value="class2">Class2</option>
      <option value="class3">Class3</option>
      <option value="class4">Class4</option>
      <option value="class5">Class5</option>
    </select>

    <label for="Message"><i class="fa-solid fa-message"></i>Message</label>
    <textarea name="message" id="Message"></textarea>

    <button type="submit" title="save"><i class="fa-solid fa-save"></i>Save Profile</button>
  </form>
  <h1>Table</h1>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Address</th>
        <th colspan="2">Phone</th>
        <th>Provience</th>
      </tr>
    </thead>
    <tbody>

        <td>984545454</td>

        <td>Bagmati</td>
      </tr>
    </tbody>
  </table>
</body>

</html>
