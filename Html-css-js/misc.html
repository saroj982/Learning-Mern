<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* --variable-name: value */
        :root {
            --primary-color: rgb(54, 238, 63);
            --text-color: #4c4d4f;

        }

        h1 {
            color: var(--primary-color);
            opacity: (0.5);
        }

        p {
            color: var(--text-color)
        }

        button {
            color: var(--primary-color);
            background-color: var(--primary-color);
            color: white;

        }
    </style>
</head>

</html>
