<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling</title>
    <!-- internal css -->
    <style>
        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 5rem;
            text-transform: uppercase;
        }
    </style>

    <!-- External css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- inline styling -->
    <h1 style="color:rgb(19, 185, 32)">Hello World</h1>
    <h2 class="heading" id="title">I am learning CSS.</h2>
    <p class="info">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Eos reprehenderit itaque sapiente
        laboriosam distinctio repellendus eaque architecto maiores, consectetur quas.</p>
    <div>This is a simple box.</div>
    <p>I love reading css.</p>

    <h3>Color Properties</h3>
    
</body>

</html>
